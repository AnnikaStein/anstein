# ============================================================================
#
# The configuration produced by default is meant to highlight the features
# that Zensical provides and to serve as a starting point for your own
# projects.
#
# ============================================================================

[project]

# The site_name is shown in the page header and the browser window title
site_name = "Annika Stein"

# The site_description is included in the HTML head and should contain a
# meaningful description of the site content for use by search engines.
site_description = "Annika Stein personal / academic page."

# The site_author attribute. This is used in the HTML head element.
site_author = "Annika Stein"

# The site_url is the canonical URL for your site.
site_url = "https://annikastein.github.io/anstein"

# The copyright notice appears in the page footer.
copyright = """
Copyright &copy; 2026 Annika Stein
"""

# docs is the default
docs_dir = "docs"
# for convenience, mkdocs gets served on 8000, zensical on 3001 locally
dev_addr = "localhost:3001"
# the place where the development happens (source of the docs)
repo_url = "https://github.com/AnnikaStein/anstein"
# under which namespace
repo_name = "AnnikaStein/anstein"
# where the files can be edited (using the repo_url, concat edit_uri, concat file)
edit_uri = "blob/master/docs/"

# Navigation. TOML allows inline tables; the keys here map to a nav list of
# { title = filename } entries which Zensical converts to a top-level menu.
nav = [
    { "Welcome!" = "index.md" },
    { "Education and Qualifications" = "education.md" },
    { "Experience (Work / Teaching)" = "work.md" },
    { "Publications" = "publications.md" },
    { "Awards" = "awards.md" },
    { "Talks, Theses and more" = "talks_theses.md" },
    { "Other activities" = "activities.md" },
    { "Contact" = "contact.md" },
]

# This is for backwards-compatibility of links ending with .html, might remove
use_directory_urls = false

# Custom CSS and JavaScript.
extra_css = ["stylesheets/extra.css"]
extra_javascript = [
    "javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

# ----------------------------------------------------------------------------
# Markdown Extensions
# ----------------------------------------------------------------------------
# Use the list-of-inline-tables form: a single declaration of
# `markdown_extensions = [...]` containing inline tables for options.
# Keys that contain dots MUST be quoted so they are literal extension
# names (e.g. "pymdownx.arithmatex"), not TOML dotted-key paths
# (which would be parsed as pymdownx → arithmatex).
#
# Do NOT also declare `[project.markdown_extensions.X]` sub-tables
# below — TOML forbids `project.markdown_extensions` from being
# both an array and a table.
markdown_extensions = [
    { "abbr"             = {} },
    { "admonition"       = {} },
    { "attr_list"        = {} },
    { "def_list"         = {} },
    { "footnotes"        = {} },
    { "md_in_html"       = {} },
    { "toc"              = { permalink = true } },
    { "pymdownx.arithmatex"  = { generic = true } },
    { "pymdownx.betterem"    = { smart_enable = "all" } },
    { "pymdownx.caret"       = {} },
    { "pymdownx.details"     = {} },
    { "pymdownx.emoji"       = {
        emoji_generator = "zensical.extensions.emoji.to_svg",
        emoji_index     = "zensical.extensions.emoji.twemoji",
    } },
    { "pymdownx.highlight"   = {} },
    { "pymdownx.inlinehilite"= {} },
    { "pymdownx.keys"        = {} },
    { "pymdownx.mark"        = {} },
    { "pymdownx.smartsymbols"= {} },
    { "pymdownx.superfences" = {} },
    { "pymdownx.tabbed"      = { alternate_style = true } },
    { "pymdownx.tasklist"    = { custom_checkbox = true } },
    { "pymdownx.tilde"       = {} },
#    { "last_updated" = {
#        repo_root = "/Users/annikastein/github/anstein",
#        date_format = "%Y-%m-%d %H:%M",
#        template = "**Last updated:** {date}",
#    } },
    { "zensical_git_dates" = {
        placeholder = "{{ last_updated }}",
        date_format = "%B %d, %Y",
        fallback_to_mtime = false,
        use_utc = true,
    } },
    #{ "git_last_updated" = {} },
#    { "extensions.git_last_updated" = {
        #repo_root = ".",
        #date_format = "%Y-%m-%d",
#    } },
]

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]

# change this to "classic" to use the traditional Material for MkDocs look.
#variant = "classic"

# Override specific blocks / partials / templates.
#custom_dir = "overrides"

# Browser tab icon.
#favicon = "images/favicon.png"

# UI language.
language = "en"

# Feature toggles.
features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    # "header.autohide",
    # "navigation.expand",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    # "navigation.instant.progress",
    "navigation.path",
    # "navigation.prune",
    "navigation.sections",
    # "navigation.tabs",
    # "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
    # "toc.integrate",
]

# do not load fonts from google
font = false

# Logo.
logo = "assets/me.jpg"

# ----------------------------------------------------------------------------
# Theme sub-tables
# ----------------------------------------------------------------------------
[project.theme.icon]
#logo = "lucide/smile"
repo = "fontawesome/brands/github"

#[project.theme.font]
#text = "Inter"
#code = "Jetbrains Mono"

# Color palette: light + dark mode.
[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

#[[project.extra.social]]
#icon = "fontawesome/brands/github"
#link = "https://github.com/user/repo"
