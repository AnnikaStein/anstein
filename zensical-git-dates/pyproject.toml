[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "zensical-git-dates"
version = "0.1.0"
description = "Pure Markdown extension for Git last updated dates."
dependencies = ["markdown>=3.0"]
requires-python = ">=3.8"

[project.entry-points."markdown.extensions"]
zensical_git_dates = "zensical_git_dates.extension:GitDatesExtension"
